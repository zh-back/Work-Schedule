name: Build macOS Installer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build macOS App and DMG Installer
        run: |
          sed -i '' 's/\r$//' scripts/build_mac.sh || true
          chmod +x scripts/build_mac.sh
          bash scripts/build_mac.sh

      - name: Upload DMG to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ScheduleWorklog-v1.0.0-mac
          path: dist/ScheduleWorklog-v1.0.0-mac.dmg
          if-no-files-found: error

      - name: Upload DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/ScheduleWorklog-v1.0.0-mac.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
